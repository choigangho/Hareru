<meta charset="utf-8">
<title>판독기 종이 스크롤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: one game frame (1280x720 scaled to fit), a two-line note under it */
:root {
  --bg: #1b1418;        /* lab shadow behind the scene */
  --fg: #efe7b4;        /* phosphor-era cream */
  --dim: #a89c80;
  --accent: #96e696;    /* scan line green */
  --frame: #2c2129;
  --font-ui: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px;
  box-sizing: border-box;
}
main { max-width: 1280px; margin: 0 auto; display: grid; gap: 14px; }
.stage {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9;
  background: var(--frame) center / 100% 100% no-repeat; image-rendering: pixelated;
  border-radius: 4px; overflow: hidden;
}
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-x; }
.note { display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--dim); font-size: 14px; line-height: 1.6; }
.note b { color: var(--fg); font-weight: 600; }
.note .pos { font-variant-numeric: tabular-nums; color: var(--accent); }
</style>

<main>
  <div class="stage" id="stage"><canvas id="cv" width="1280" height="720" aria-label="판독기 종이: 마우스 휠이나 두 손가락으로 스크롤"></canvas></div>
  <div class="note">
    <span><b>스크롤:</b> 유리창 위에서 마우스 휠, 트랙패드 두 손가락, 휴대폰은 끌기</span>
    <span>종이 위아래 끝만 말려 들어가고, 글자가 있는 가운데는 평평합니다.</span>
    <span class="pos" id="pos"></span>
  </div>
</main>

// paper on the reclined glass (screen px of the 1280x720 frame)
const TOPY = 112, BOTY = 446, VIEW = BOTY - TOPY;
const xr = y => { const t = (y - TOPY) / (BOTY - TOPY); return [352 - 18 * t, 838 + 16 * t]; };
const CURL = 38;                      // height of each rolled end
const PAPER = '#f7f2d6', INK = '#281e1e', SUB = '#6e6455';
const MIN = '"Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif';
const GOT = '"Apple SD Gothic Neo", "Noto Sans KR", sans-serif';

// one sense of 分かる with all of its examples (D-15: one sense per paper; this sense has many)
const word = { reading: 'わかる', head: '分かる', senses: ['알다, 이해하다', '판명되다'], cur: 0 };
const examples = [
  ['この字の意味、分かりますか？', '이 글자 뜻, 알겠어요?'],
  ['日本語が少し分かります。', '일본어를 조금 알아요.'],
  ['言っていることがよく分からない。', '하는 말을 잘 모르겠다.'],
  ['駅までの道が分かりますか。', '역까지 가는 길을 아세요?'],
  ['答えが分かった人は手を挙げてください。', '답을 안 사람은 손을 들어 주세요.'],
  ['彼の気持ちがやっと分かった。', '그의 마음을 겨우 알았다.'],
];

const CW = 520, L = 46;
const content = document.createElement('canvas');
let CH = 0;
// D-15: a long example wraps to two lines, then one font step smaller; no line starts with 、。？！
function wrap(g, text, size, maxW) {
  g.font = `${size}px ${MIN}`;
  const lines = []; let cur = '';
  for (const ch of text) {
    if (cur && g.measureText(cur + ch).width > maxW && !'、。？！」'.includes(ch)) { lines.push(cur); cur = ch; }
    else cur += ch;
  }
  lines.push(cur); return lines;
}
function exLines(g, jp) {
  for (const size of [28, 24]) { const l = wrap(g, jp, size, CW - 2 * L); if (l.length <= 2) return [size, l]; }
  return [24, wrap(g, jp, 24, CW - 2 * L)];
}
function layout() {
  const top = CURL + 14, exTop = top + 196;
  const g0 = content.getContext('2d');
  const blocks = examples.map(([jp, ko]) => { const [size, lines] = exLines(g0, jp); return { size, lines, ko, h: lines.length * (size + 12) + 30 + 40 }; });
  CH = exTop + blocks.reduce((a, b) => a + b.h, 0) + CURL;
  content.width = CW; content.height = CH;
  const g = content.getContext('2d');
  g.fillStyle = PAPER; g.fillRect(0, 0, CW, CH);
  g.textBaseline = 'middle';
  g.textAlign = 'center'; g.fillStyle = SUB; g.font = `18px ${MIN}`; g.fillText(word.reading, CW / 2, top + 16);
  g.fillStyle = INK; g.font = `64px ${MIN}`; g.fillText(word.head, CW / 2, top + 74);
  // meaning line: every sense, the current one bold
  const parts = word.senses.map((s, i) => ({ s, f: `${i === word.cur ? 'bold ' : ''}22px ${GOT}`, c: i === word.cur ? INK : SUB }));
  const sep = '  ·  ';
  g.font = `22px ${GOT}`; const sepW = g.measureText(sep).width;
  let w = parts.reduce((a, p, i) => { g.font = p.f; return a + g.measureText(p.s).width + (i ? sepW : 0); }, 0);
  let x = CW / 2 - w / 2; g.textAlign = 'left';
  parts.forEach((p, i) => {
    if (i) { g.font = `22px ${GOT}`; g.fillStyle = SUB; g.fillText(sep, x, top + 134); x += sepW; }
    g.font = p.f; g.fillStyle = p.c; g.fillText(p.s, x, top + 134); x += g.measureText(p.s).width;
  });
  g.fillStyle = '#c8bea0'; g.fillRect(L, top + 160, CW - 2 * L, 2);
  let y = exTop;
  blocks.forEach((b, i) => {
    g.fillStyle = INK; g.font = `${b.size}px ${MIN}`;
    b.lines.forEach((ln, j) => g.fillText(ln, L, y + j * (b.size + 12)));
    const ky = y + (b.lines.length - 1) * (b.size + 12) + 42;
    g.fillStyle = SUB; g.font = `20px ${GOT}`; g.fillText(b.ko, L, ky);
    if (i < blocks.length - 1) { g.fillStyle = '#e4dcbc'; g.fillRect(L, ky + 30, CW - 2 * L, 1); }
    y += b.h;
  });
}

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const maxScroll = () => Math.max(0, CH - VIEW);
let s = 0, target = 0;

// source row (content y) for a screen row, with the rolled ends
function rowSource(y) {
  const d = y - TOPY;
  if (d < CURL) {                      // top roll: the paper bends away over a cylinder of radius CURL
    const h = CURL - d, a = CURL * Math.asin(Math.min(1, h / CURL));
    return [s + CURL - a, Math.cos(a / CURL)];
  }
  if (d > VIEW - CURL) {               // bottom roll
    const h = d - (VIEW - CURL), a = CURL * Math.asin(Math.min(1, h / CURL));
    return [s + VIEW - CURL + a, Math.cos(a / CURL)];
  }
  return [s + d, 1];
}

function draw() {
  ctx.clearRect(0, 0, 1280, 720);
  for (let y = TOPY; y < BOTY; y++) {
    const [a, b] = xr(y), [src, lit] = rowSource(y);
    const sy = Math.floor(src);
    if (sy >= 0 && sy < CH) ctx.drawImage(content, 0, sy, CW, 1, a, y, b - a, 1);
    else { ctx.fillStyle = PAPER; ctx.fillRect(a, y, b - a, 1); }
    if (lit < 1) {                     // dark shade where the paper turns away from the light
      ctx.fillStyle = `rgba(30,20,18,${(0.95 * Math.pow(1 - lit, 0.55)).toFixed(3)})`;
      ctx.fillRect(a, y, b - a, 1);
    }
    if ((y - TOPY) % 8 === 0) { ctx.fillStyle = 'rgba(120,110,80,0.06)'; ctx.fillRect(a, y, b - a, 1); }
  }
  // scan line resting across the glass
  const ly = 287, [la, lb] = xr(ly);
  const glow = ctx.createLinearGradient(0, ly - 34, 0, ly + 34);
  glow.addColorStop(0, 'rgba(150,230,150,0)'); glow.addColorStop(0.5, 'rgba(150,230,150,0.22)'); glow.addColorStop(1, 'rgba(150,230,150,0)');
  ctx.fillStyle = glow; ctx.fillRect(la, ly - 34, lb - la, 68);
  ctx.fillStyle = '#96e696'; ctx.fillRect(la - 14, ly - 2, lb - la + 28, 3);
  const p = maxScroll() ? Math.round(100 * s / maxScroll()) : 0;
  document.getElementById('pos').textContent = `종이 위치 ${p}%`;
}

function tick() {
  const before = s;
  s += (target - s) * (matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 0.25);
  if (Math.abs(target - s) < 0.3) s = target;
  if (s !== before || first) { first = false; draw(); }
  requestAnimationFrame(tick);
}
let first = true;

function toFrame(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) * 1280 / r.width, (e.clientY - r.top) * 720 / r.height];
}
function overPaper(x, y) { if (y < TOPY || y > BOTY) return false; const [a, b] = xr(y); return x >= a - 14 && x <= b + 14; }

cv.addEventListener('wheel', e => {
  const [x, y] = toFrame(e);
  if (!overPaper(x, y)) return;
  const k = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? VIEW : 1;
  const next = Math.max(0, Math.min(maxScroll(), target + e.deltaY * k));
  if (next !== target || (target > 0 && target < maxScroll())) e.preventDefault();
  target = next;
}, { passive: false });

let drag = null;
cv.addEventListener('pointerdown', e => {
  const [x, y] = toFrame(e);
  if (!overPaper(x, y)) return;
  drag = { y, t: target }; cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const [, y] = toFrame(e);
  target = s = Math.max(0, Math.min(maxScroll(), drag.t - (y - drag.y)));
  draw();
});
cv.addEventListener('pointerup', () => drag = null);
cv.addEventListener('pointercancel', () => drag = null);

(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { layout(); draw(); requestAnimationFrame(tick); });
</script>
